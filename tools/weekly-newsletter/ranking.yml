# TheBluesland Weekly - story-ranking ayarlari
# (docs/specs/weekly-newsletter-story-ranking.md, Design sections 1-2).
#
# puan = farkli kaynak sayisi x coverageWeight + hikayenin turunun bonusu.
# Tur, hikayenin tum uye basliklarinda aranan ifadelerle belirlenir; listede yukaridan asagi ilk
# eslesen tur kazanir. Ifadeler kucuk harf, aksansiz, noktalamasiz yazilir ve tam kelime olarak
# eslesir ("dies" "studies" icinde eslesmez). "exclude" ifadeleri o tur aranmadan once metinden
# silinir. Hicbir tur eslesmezse "release" (bonus 0) kabul edilir.
#
# Her degisiklikten sonra StoryRankerGoldSetTests calisir (Mehmet'in W46 secimi).

picks: 5
backups: 3
coverageWeight: 1.0
maxPerType: 2

# Iki hikayenin TF-IDF merkezleri bu kosinusu gecerse "ayni tartismanin parcalari" sayilir ve
# yalnizca puani yuksek olan secilir (or. Robbie Williams / "Christmas Wrapping" - Olivia Rodrigo).
relatedThreshold: 0.15

# Ilk 5'te bu kelimelerden hicbiri (baslik + ozet) yoksa, eslesen en iyi aday 5. siradakinin
# yerine gecer - yalnizca puani 5. siradakinin en az bu orani kadarsa. Kota degil.
genreKeywords: [blues, rock, soul, indie, punk, metal, folk, americana, guitar, guitarist, garage, grunge, shoegaze]
genreSwapMinRatio: 0.7

types:
  - name: roundup          # editoryal liste, haber degil: hic secilmez
    excluded: true
    phrases: [best songs, great songs, new albums you should, selects playlist, weekly round up, the number ones, songs of the week]
  - name: obituary
    bonus: 1.5
    phrases: [dies, died, dead, death, passed away]
    exclude: [near death]
  - name: legal
    bonus: 1.0
    phrases: [lawsuit, sues, sued, court, trial, judge, charged, arrested, assault, contract, contracts]
  - name: industry
    bonus: 1.0
    phrases: [chart, charts, streaming, royalties, royalty, acquires, acquisition, deal, earnings, quarter, q1, q2, q3, q4, revenue, label, distribution]
  - name: milestone
    bonus: 0.75
    phrases: [diagnosis, diagnosed, hospitalized, hospitalised, cancel, cancels, canceled, cancelled, hiatus, reunite, reunites, reunion, farewell, final show, final concert, retire, retires, retirement, return to stage, hall of fame, induction]
  - name: live
    bonus: 0.25
    phrases: [tour, residency, festival, headline, headlines, headlining, concert]
