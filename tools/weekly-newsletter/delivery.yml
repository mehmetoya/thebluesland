# TheBluesland Weekly delivery (docs/specs/weekly-newsletter-issue-delivery.md, Design section 5).
# Nothing here is secret; the only secret is KIT_API_KEY, held by newsletter-deliver.yml alone.

# Send times are wall-clock times in this zone on the issue's Monday (map: approved schedule).
timeZone: Europe/Istanbul

# A merge closer than this to a send time misses that week (spec section 2).
minimumLeadMinutes: 2

# Kit's "public" flag publishes a broadcast to Kit's own web page. Our archive is /weekly.
kitPublic: false

languages:
  tr:
    sendTime: "08:00"
    # Kit tag "weekly-tr" (created by the setup-tags task, 2026-11-10).
    kitTagId: 25679730
    # Kit form "TheBluesland Weekly TR"; kit-sync-tags copies its confirmed subscribers into the tag.
    kitFormId: 10170833
  en:
    sendTime: "15:00"
    # Kit tag "weekly-en" (created by the setup-tags task, 2026-11-10).
    kitTagId: 25679731
    # Kit form "TheBluesland Weekly EN".
    kitFormId: 10170837
