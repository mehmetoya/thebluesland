name: Sync Spotify playlist cache

# US-004 (spec section 12.4/12.5, SEC-001): runs tools/spotify-playlist-fetcher (US-003) once a
# month to refresh spotify_playlist_cache from the Spotify Web API. This is the ONLY workflow that
# may reference the SPOTIFY_CLIENT_ID, SPOTIFY_REFRESH_TOKEN and NEON_SYNC_CONNECTION_STRING
# secrets - ci.yml and deploy.yml must never declare them (US-013 AC3). Mehmet must additionally
# restrict these three secrets to this workflow in the GitHub repo settings (Settings > Secrets and
# variables > Actions, or an "Environment" scoped to this workflow) - that scoping is a one-time,
# code-external step and cannot be enforced from the YAML alone.
#
# NEON_SYNC_CONNECTION_STRING must be the spotify_cache_readwrite role's connection string, created
# by src/TheBluesland.Data/Scripts/create-spotify-cache-roles.sql (run once, by hand, against the
# Neon project - see that script's header for details).
#
# This is the ONLY workflow with write access to the repository (contents: write /
# pull-requests: write below) - ci.yml and deploy.yml must stay contents: read, unchanged. The
# write path is narrow and one-directional: when the "sync" mode (never list-playlists/dump-cache/
# resync-eras) finds a playlist Spotify now reports private, it flips that content file's
# status: published to status: draft (never the reverse), then opens a pull request and enables
# auto-merge rather than pushing to main directly - main stays branch-protected. Mehmet must
# additionally enable this repo's auto-merge feature (Settings > General > Allow auto-merge) for
# `gh pr merge --auto` to take effect - a one-time, code-external step, same class as the
# secret-scoping note above.

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "sync" (default) writes spotify_playlist_cache as usual. "list-playlists" is read-only
          discovery: lists every playlist on the account (id/name/track count) in this run's job
          summary, for picking an editorial candidate. "dump-cache" is read-only: prints every
          already-synced spotify_playlist_cache row (name/description/track count/artists) to the
          job summary. Neither read-only mode writes to the database or content/playlists.
          "resync-eras" (US-025) writes spotify_playlist_cache like "sync" but skips no playlist's
          track read even when its snapshot id is unchanged - only needed after an era-bucket
          *boundary* change (e.g. a new decade split), since threshold-only changes are already
          covered by report-eras recomputing from stored bucket counts (US-026). Uses the same
          quota as a full first sync, so run it deliberately, not routinely.
        required: false
        default: sync
        type: choice
        options:
          - sync
          - list-playlists
          - dump-cache
          - resync-eras

# Share the Spotify API quota across report and sync runs, including different branches.
concurrency:
  group: spotify-api
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      NEON_SYNC_CONNECTION_STRING: ${{ secrets.NEON_SYNC_CONNECTION_STRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj

      - name: Build
        run: dotnet build tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj --configuration Release --no-restore

      # `github.event.inputs.mode` only exists on a workflow_dispatch trigger; the monthly
      # schedule trigger falls through the `|| 'sync'` default, same as an unset dispatch input.
      - name: Run
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.mode || 'sync' }}"
          if [ "$mode" = "list-playlists" ]; then
            dotnet run --project tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj --configuration Release --no-build -- list-playlists | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = "dump-cache" ]; then
            dotnet run --project tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj --configuration Release --no-build -- dump-cache | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = "resync-eras" ]; then
            dotnet run --project tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj --configuration Release --no-build -- resync-eras | tee -a "$GITHUB_STEP_SUMMARY"
          else
            dotnet run --project tools/spotify-playlist-fetcher/TheBluesland.SpotifyFetcher.csproj --configuration Release --no-build
          fi

      # Only the default "sync" mode ever rewrites content/playlists (see Program.cs's sync
      # branch) - list-playlists/dump-cache/resync-eras stay read-only, so this step has nothing
      # to do for them and exits without opening a PR.
      - name: Open pull request for auto-unpublished playlists
        if: ${{ (github.event.inputs.mode || 'sync') == 'sync' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- content/playlists)" ]; then
            echo "No content/playlists changes - nothing made private this run."
            exit 0
          fi

          branch="auto/unpublish-private-playlists-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/playlists
          git commit -m "Auto-unpublish playlist(s) made private on Spotify" -m "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Auto-unpublish playlist(s) made private on Spotify" \
            --body "Deterministic, sync-generated: one or more content/playlists/*.md files whose Spotify playlist is now private had status: published flipped to status: draft (publishedAt removed). One-directional only - never auto-publishes. See this run's job summary for which slug(s). Auto-merges once required checks pass.")"
          gh pr merge --auto --squash "$pr_url"
