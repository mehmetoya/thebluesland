name: Newsletter draft

# docs/specs/weekly-newsletter-issue-drafting.md (Design section 5) and
# docs/specs/weekly-newsletter-issue-review.md: drafts the TR and EN issue with Gemini every Sunday
# at 11:15 Europe/Istanbul and opens it as a draft PR on a newsletter/<year>-W<week> branch.
# Gemini's free quota resets at 00:00 Pacific (08:00 UTC), so the run must start after that or it
# spends the previous day's quota. The week's window still ends at 10:00 Istanbul (issue-week).
# GitHub's schedule is unreliable (the two-hourly ingest has skipped hours), so the Draft step runs
# "ingest" itself right before drafting; an ingest failure only warns.
# Merging that PR is Mehmet's approval (ADR-0006 madde 2); the bot never approves or merges.
# Dispatch runs only show the draft (job summary + artifact) unless open_pr is set.
#
# Two jobs, so the AI key and the right to write the repository never meet (ADR-0006 madde 5):
#   draft   - contents: read + pull-requests: read (to see whether the week's PR exists); GEMINI_API_KEY and NEON_NEWSLETTER_CONNECTION_STRING on its single
#             Draft step only. The prompt holds only the week's fact card and the voice guide;
#             never Spotify or subscriber data. Gemini free tier only.
#   open-pr - contents: write + pull-requests: write, no secret at all. Receives the draft only as
#             files, validates them, and pushes nothing but a newsletter/ branch.
# Enforced by tests/TheBluesland.UnitTests/Workflows/NewsletterDraftWorkflowTests.cs and the
# secret isolation tests next to it.

on:
  schedule:
    # Sunday 08:15 UTC = 11:15 Europe/Istanbul (no daylight saving since 2016), just after the
    # Gemini free quota resets at 08:00 UTC.
    - cron: "15 8 * * 0"
    # Safety retry at 14:00 Istanbul: does nothing when the week's PR or issue files already exist.
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      from:
        description: "Window start, UTC (yyyy-MM-dd or yyyy-MM-ddTHH:mm). Empty = 7 days before 'to'."
        required: false
        default: ""
      to:
        description: "Window end, UTC, exclusive. Empty = the last Sunday 10:00 Europe/Istanbul."
        required: false
        default: ""
      model:
        description: "Gemini model id (optional; the tool's free-tier default if empty)."
        required: false
        default: ""
      open_pr:
        description: "Also open the draft PR (as the Sunday schedule does)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # Read-only. pull-requests: read lets the Plan step ask whether the week's PR already exists.
    permissions:
      contents: read
      pull-requests: read
    # A full answer took over 90 s on the first production run (2026-11-10); each call may take up
    # to 3 min and is retried, so give the job room. Typical runs take a few minutes.
    timeout-minutes: 60
    outputs:
      week: ${{ steps.plan.outputs.week }}
      open_pr: ${{ steps.plan.outputs.open_pr }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj

      - name: Build
        run: dotnet build tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-restore

      # Which issue this run drafts, and whether it is already drafted (then Gemini is not called).
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPEN_PR_INPUT: ${{ inputs.open_pr }}
          WINDOW_FROM: ${{ inputs.from }}
          WINDOW_TO: ${{ inputs.to }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(issue-week)
          if [ -n "$WINDOW_FROM" ]; then args+=(--from "$WINDOW_FROM"); fi
          if [ -n "$WINDOW_TO" ]; then args+=(--to "$WINDOW_TO"); fi
          week="$(dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- "${args[@]}")"
          if ! [[ "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then echo "Unexpected issue id."; exit 1; fi
          open_pr=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$OPEN_PR_INPUT" = "true" ]; then open_pr=true; fi
          skip=false
          if [ "$open_pr" = "true" ]; then
            # Skip only when a PR for the week exists (any state: a closed one is Mehmet's decision) or
            # the issue files are on main. A branch alone is not enough: if "gh pr create" failed
            # after the push, the open-pr job must get a fresh draft to finish the job.
            pr_count="$(gh pr list --head "newsletter/$week" --state all --json number --jq length)"
            if [ "$pr_count" != "0" ] || [ -e "content/weekly/$week.tr.md" ] || [ -e "content/weekly/$week.en.md" ]; then
              skip=true
              printf '## Weekly draft · %s\n\nAlready drafted (a PR for newsletter/%s exists or merged issue files exist); nothing to do.\n' "$week" "$week" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          { echo "week=$week"; echo "open_pr=$open_pr"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

      # Inputs reach the shell only as environment variables, never interpolated into the script.
      - name: Draft
        if: steps.plan.outputs.skip != 'true'
        env:
          NEON_NEWSLETTER_CONNECTION_STRING: ${{ secrets.NEON_NEWSLETTER_CONNECTION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          WINDOW_FROM: ${{ inputs.from }}
          WINDOW_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          # Feed and model text reach the log; stop "::" lines in it from running as workflow commands.
          stop_token="$(openssl rand -hex 16)"
          echo "::stop-commands::${stop_token}"
          args=(draft --out "$RUNNER_TEMP/weekly")
          if [ -n "$WINDOW_FROM" ]; then args+=(--from "$WINDOW_FROM"); fi
          if [ -n "$WINDOW_TO" ]; then args+=(--to "$WINDOW_TO"); fi
          # GitHub's schedule skips runs, so fetch the latest articles right before drafting. Failing
          # to ingest only warns: the draft then uses what the two-hourly ingest already stored.
          ingest_status=0
          dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- ingest | tee -a "$GITHUB_STEP_SUMMARY" || ingest_status=$?
          if [ "$ingest_status" -ne 0 ]; then echo "WARNING: ingest failed (exit $ingest_status); drafting continues with the articles already stored."; fi
          draft_status=0
          dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || draft_status=$?
          echo "::${stop_token}::"
          if [ "$ingest_status" -ne 0 ]; then
            echo "::warning title=Ingest failed before drafting::ingest exited with $ingest_status; the draft used the articles already stored."
          fi
          exit "$draft_status"

      - name: Upload draft
        if: steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-draft
          path: ${{ runner.temp }}/weekly/
          if-no-files-found: error
          retention-days: 14

  open-pr:
    needs: draft
    if: needs.draft.outputs.open_pr == 'true' && needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release

      - name: Download draft
        uses: actions/download-artifact@v4
        with:
          name: weekly-draft
          path: ${{ runner.temp }}/weekly

      # Only the two issue files are committed; backups and the PR body stay in review/ and reach
      # the PR as its description. The branch name is checked before anything is pushed.
      - name: Open draft PR
        env:
          WEEK: ${{ needs.draft.outputs.week }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then echo "Unexpected issue id."; exit 1; fi
          branch="newsletter/$WEEK"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # A PR (open, merged or closed) means the week is handled. A branch without one is what
            # a failed "gh pr create" leaves behind: build on that branch and open the PR now.
            if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" != "0" ]; then
              echo "A PR for $branch already exists; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch --depth=1 origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi
          mkdir -p content/weekly
          cp "$RUNNER_TEMP/weekly/$WEEK.tr.md" "$RUNNER_TEMP/weekly/$WEEK.en.md" content/weekly/
          dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- validate-weekly "$GITHUB_WORKSPACE/content/weekly"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/weekly/$WEEK.tr.md" "content/weekly/$WEEK.en.md"
          if ! git diff --cached --quiet; then git commit -m "newsletter: draft $WEEK (TR + EN)"; fi
          git push origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/weekly/review/$WEEK.pr-body.md"
          printf '\n---\n\nTaslak çalışması ve artifact: %s\n' "$RUN_URL" >> "$body"
          title="TheBluesland Weekly $WEEK"
          # The draft tool marks a fallback-model draft in the PR body; surface it in the title too.
          if grep -qF '[DÜŞÜK MODEL]' "$body"; then title="[DÜŞÜK MODEL] $title"; fi
          url="$(gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$body")"
          gh pr edit "$url" --add-assignee "$OWNER" || echo "::warning::Could not assign the PR to $OWNER."
          echo "Draft PR: $url" >> "$GITHUB_STEP_SUMMARY"
