name: Newsletter deliver

# docs/specs/weekly-newsletter-issue-delivery.md: schedules every merged issue in
# content/weekly/ as a Kit broadcast for its send time (TR Monday 08:00, EN Monday 15:00
# Europe/Istanbul, from tools/weekly-newsletter/delivery.yml). Kit's own scheduler sends it, so
# GitHub's cron delays never move a send time. main is the source of truth: an edit before the send
# updates the broadcast, a revert cancels it, a sent broadcast is never touched, and a merge after
# the cut-off does not go out that week (ADR-0006 madde 2; map schedule).
#
# Secrets: KIT_API_KEY only, on the single Deliver step. No Gemini, no database, no write access:
# this workflow reads main and talks to Kit. Before delivering it tags each sign-up form's confirmed
# subscribers (kit-sync-tags; Kit's free plan has no form rules): only subscriber ids, in memory,
# and only counts reach the log. A failed sync never blocks the delivery: deliver still runs, then
# the step ends red with a warning. A merge after the cut-off keeps the run green (it is a decision)
# but raises a warning annotation and a LATE banner at the top of the report. The "smoke" task
# (kit-smoke) creates, reads and deletes a never-sent draft to prove the Kit write path. Enforced by
# tests/TheBluesland.UnitTests/Workflows/NewsletterDeliverWorkflowTests.cs.

on:
  push:
    branches: [main]
    paths:
      - "content/weekly/**"
      - "tools/weekly-newsletter/delivery.yml"
  schedule:
    # 30 minutes before each send (Monday 05:00 and 12:00 UTC): repairs a failed push run.
    - cron: "30 4 * * 1"
    - cron: "30 11 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: "deliver = schedule merged issues; setup-tags = create the weekly-tr/weekly-en tags in Kit and print their ids; smoke = create, read and delete a never-sent draft broadcast to prove the Kit write path."
        type: choice
        options: [deliver, setup-tags, smoke]
        default: deliver
      apply:
        description: "Change Kit (otherwise a dry run that only shows the plan)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release

      # Monday repair crons only, 30 minutes before a send: best effort (no secrets, never fails the
      # run) so the site is warm before readers click the issue link.
      - name: Warm up the site
        if: github.event_name == 'schedule'
        run: curl -fsS --max-time 60 https://thebluesland.com/health/ready || true

      # Inputs reach the shell only as environment variables, never interpolated into the script.
      - name: Deliver
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY_INPUT: ${{ inputs.apply }}
          TASK_INPUT: ${{ inputs.task }}
        run: |
          set -euo pipefail
          # Issue text reaches the log; stop "::" lines in it from running as workflow commands.
          stop_token="$(openssl rand -hex 16)"
          echo "::stop-commands::${stop_token}"
          report="$RUNNER_TEMP/deliver-report.md"
          args=(deliver --content "$GITHUB_WORKSPACE/content/weekly")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$APPLY_INPUT" != "true" ]; then args+=(--dry-run); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TASK_INPUT" = "setup-tags" ]; then args=(kit-tags weekly-tr weekly-en); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TASK_INPUT" = "smoke" ]; then args=(kit-smoke); fi
          # A failed tag sync must not stop the delivery: remember it, run deliver, fail at the end.
          sync_status=0
          if [ "${args[0]}" = "deliver" ]; then
            sync=(kit-sync-tags)
            if [[ " ${args[*]} " == *" --dry-run "* ]]; then sync+=(--dry-run); fi
            dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- "${sync[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || sync_status=$?
          fi
          deliver_status=0
          dotnet run --project tools/weekly-newsletter/TheBluesland.WeeklyNewsletter.csproj --configuration Release --no-build -- "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$report" || deliver_status=$?
          echo "::${stop_token}::"
          # Annotations only after the stop token: they carry fixed text, never report text.
          if grep -qE '^\*\*.+ LATE — [a-z]{2} will not be sent this week' "$report"; then
            echo "::warning title=Weekly issue not sent::An issue was merged after its cut-off and will not be sent this week; see the job summary."
          fi
          if [ "$sync_status" -ne 0 ]; then
            echo "::warning title=Kit tag sync failed::kit-sync-tags exited with $sync_status. Deliver still ran, but new subscribers may be missing from the delivery tags; check the log."
          fi
          if [ "$deliver_status" -ne 0 ]; then exit "$deliver_status"; fi
          if [ "$sync_status" -ne 0 ]; then exit 1; fi
